name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query pattern finds existing code rather
    # than waiting for someone to touch the file it lives in.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # Required to upload results to the Security tab.
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended picks up taint-tracking rules beyond the default
          # set — the class of query that catches an unvalidated value reaching
          # a sink, which is what most of the risk here looks like.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
