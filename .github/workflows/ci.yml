name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default GITHUB_TOKEN is read-write. Nothing here writes to the repo, and
# a token scoped down is a token a compromised dependency cannot use.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # verify:entitlements and verify:exposure write to and delete from the
    # database, so they need a real one. A service container is disposable,
    # which is the only kind of database they may ever point at.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tbc_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tbc_ci
      # Not a secret: a throwaway value so modules that read it at import time
      # resolve. Real secrets are never needed to typecheck, lint or build.
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint

      # Unit tests need no database, so they run before the Postgres-dependent
      # steps and fail fast.
      - run: npm test

      - name: Apply migrations
        run: npm run db:migrate

      # verify:entitlements exits 1 with "Need at least 2 published products"
      # against an empty database — it needs a catalog to grant and revoke
      # against. Confirmed by running this exact sequence on a fresh database.
      - name: Seed the catalog
        run: npm run db:seed

      - name: Entitlement rules
        run: npm run verify:entitlements

      - name: Private-field exposure
        run: npm run verify:exposure

      # Exits 0 for thin copy and non-zero only for a structural fault, so a
      # missing description shows in the log without blocking a merge. Against
      # the seeded catalog it reports the seed's own short descriptions, which
      # is the honest result rather than a rigged green.
      - name: SEO metadata
        run: npm run verify:seo

      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Blocks on a critical advisory in code that ships.
      #
      # Still critical rather than high, but for a smaller reason than before.
      # The Next 16 upgrade cleared the sharp and postcss advisories, and
      # drizzle-orm 0.45.2 cleared a SQL injection. What remains is 4 high,
      # which is one nodemailer advisory counted four times through
      # @auth/core, next-auth and @auth/drizzle-adapter.
      #
      # It cannot be fixed here: next-auth 5.0.0-beta.32 declares
      # nodemailer "^7.0.7 || ^8.0.5", so 9.0.5 installs as an invalid peer on
      # the only path anyone signs in by. The vector is the `raw` message
      # option, which this app never uses. SECURITY.md records it and what
      # retires it — raise this to high when Auth.js accepts nodemailer 9.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      # Report-only, including dev dependencies: visible in the log without
      # failing the job, so a new advisory is noticed even while the known
      # exception stands.
      - name: Audit all dependencies (report only)
        run: npm audit || true
